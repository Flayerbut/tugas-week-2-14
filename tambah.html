<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KosFlow - Tambah Pengeluaran</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <header>
        <h1>KosFlow</h1>
        <p>Tambah data pengeluaran</p>

        <nav class="navbar navbar-expand-lg navbar-dark bg-primary rounded p-2">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="index.html">KosFlow</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="index.html">Beranda</a>
                        <a class="nav-link active" href="tambah.html">Tambah Pengeluaran</a>
                        <a class="nav-link" href="detail.html">Detail Pengeluaran</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4">

        <!-- Notifikasi (diisi & dianimasikan oleh jQuery) -->
        <div id="notifikasi" class="alert" style="display: none;"></div>

        <section class="card shadow-sm border-0 p-4">
            <h2 class="fw-bold mb-4">Form Tambah Pengeluaran</h2>

            <form id="form-pengeluaran" novalidate>

                <div class="mb-3">
                    <label for="tanggal" class="form-label">Tanggal Pengeluaran:</label>
                    <input type="date" id="tanggal" name="tanggal" class="form-control">
                    <div class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                    <label for="kategori" class="form-label">Kategori:</label>
                    <select id="kategori" name="kategori" class="form-select">
                        <option value="">-- Pilih Kategori --</option>
                        <option value="makanan">Makanan</option>
                        <option value="transportasi">Transportasi</option>
                        <option value="kebutuhan-kos">Kebutuhan Kos</option>
                        <option value="hiburan">Hiburan</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                    <div class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                    <label for="jumlah" class="form-label">Jumlah Pengeluaran:</label>
                    <input type="number" id="jumlah" name="jumlah" class="form-control" placeholder="Contoh: 25000">
                    <div class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                    <label for="keterangan" class="form-label">Keterangan:</label>
                    <textarea id="keterangan" name="keterangan" class="form-control" rows="5"
                        placeholder="Masukkan keterangan pengeluaran"></textarea>
                    <div class="invalid-feedback"></div>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-primary">
                        Simpan Pengeluaran
                    </button>
                    <button type="reset" class="btn btn-outline-secondary">
                        Reset
                    </button>
                </div>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 KosFlow</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
